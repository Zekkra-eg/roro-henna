<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invitation</title>

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGE
    ========================= */

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      /* Transparent instead of black */
      background: transparent;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: transparent;
    }


    /* =========================
       VIDEOS
    ========================= */

    video {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      /*
        Keeps the video filling
        the entire screen
      */
      object-fit: cover;

      display: block;
    }


    /* =========================
       VIDEO 1
    ========================= */

    #video1 {
      z-index: 1;
    }


    /* =========================
       VIDEO 2
    ========================= */

    #video2 {
      z-index: 2;

      opacity: 0;

      transition: opacity 0.15s ease;

      pointer-events: none;
    }


    #video2.show {
      opacity: 1;

      pointer-events: auto;
    }


    /* =========================
       CONFETTI
    ========================= */

    #confetti {
      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

      overflow: hidden;

      background: transparent;
    }


    /* =========================
       CONFETTI PIECES
    ========================= */

    .piece {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 15px;

      opacity: 0;

      border-radius: 2px;

      animation:
        confettiExplosion
        2.8s
        cubic-bezier(.15, .7, .3, 1)
        forwards;
    }


    /* =========================
       CONFETTI ANIMATION
    ========================= */

    @keyframes confettiExplosion {

      0% {

        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(0deg)
          scale(0.4);

        opacity: 1;
      }


      15% {
        opacity: 1;
      }


      100% {

        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(1);

        opacity: 0;
      }

    }


    /* =========================
       INVISIBLE TAP AREA
       VIDEO 2 ONLY
    ========================= */

    #tapArea {

      position: absolute;

      z-index: 20;

      /*
        Large invisible area
        in the center
      */

      width: 70%;
      height: 45%;

      left: 15%;
      top: 27.5%;

      cursor: pointer;

      background: transparent;

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      /*
        Hidden while Video 1
        is playing
      */

      display: none;
    }


    /*
      Activated only when
      Video 2 starts
    */

    #tapArea.active {
      display: block;
    }


  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       VIDEO 1
  ========================= -->

  <video
    id="video1"
    autoplay
    muted
    playsinline
    preload="auto"
  >

    <source
      src="5.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       VIDEO 2
  ========================= -->

  <video
    id="video2"
    muted
    playsinline
    loop
    preload="auto"
  >

    <source
      src="6.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       CONFETTI
    ========================= -->

  <div id="confetti"></div>


  <!-- =========================
       INVISIBLE TAP AREA
       ONLY VIDEO 2
  ========================= -->

  <div id="tapArea"></div>


</div>



<script>


  /* =========================
     ELEMENTS
  ========================= */

  const video1 =
    document.getElementById("video1");


  const video2 =
    document.getElementById("video2");


  const confetti =
    document.getElementById("confetti");


  const tapArea =
    document.getElementById("tapArea");



  /* =========================
     START VIDEO 1
  ========================= */

  video1.play().catch(error => {

    console.log(
      "Video 1 autoplay:",
      error
    );

  });



  /* =========================
     VIDEO 1 FINISHED
  ========================= */

  video1.addEventListener(
    "ended",
    startVideo2
  );



  function startVideo2() {


    console.log(
      "Video 1 finished"
    );


    /* -------------------------
       Start Video 2
    ------------------------- */

    video2.currentTime = 0;


    video2.play().catch(error => {

      console.log(
        "Video 2 play error:",
        error
      );

    });


    /* -------------------------
       Show Video 2
    ------------------------- */

    video2.classList.add(
      "show"
    );


    /* -------------------------
       Hide Video 1
    ------------------------- */

    setTimeout(() => {

      video1.style.display =
        "none";

    }, 200);


    /* -------------------------
       Activate tap area
       ONLY FOR VIDEO 2
    ------------------------- */

    tapArea.classList.add(
      "active"
    );


    /* -------------------------
       Start Confetti
    ------------------------- */

    createConfetti();

  }



  /* =========================
     CREATE CONFETTI
  ========================= */

  function createConfetti() {

    confetti.innerHTML = "";


    const colors = [

      "#FFD166",
      "#EF476F",
      "#06D6A0",
      "#118AB2",
      "#8338EC",
      "#FF9F1C",
      "#FF70A6",
      "#FFFFFF"

    ];


    const pieces = 120;


    for (
      let i = 0;
      i < pieces;
      i++
    ) {


      const piece =
        document.createElement(
          "div"
        );


      piece.className =
        "piece";


      /* -------------------------
         Random Direction
      ------------------------- */

      const angle =
        Math.random()
        * Math.PI
        * 2;


      /* -------------------------
         Random Distance
      ------------------------- */

      const distance =
        300 +
        Math.random() * 650;


      const x =
        Math.cos(angle)
        * distance;


      const y =
        Math.sin(angle)
        * distance;


      /* -------------------------
         CSS Variables
      ------------------------- */

      piece.style.setProperty(
        "--x",
        x + "px"
      );


      piece.style.setProperty(
        "--y",
        y + "px"
      );


      /* -------------------------
         Random Rotation
      ------------------------- */

      piece.style.setProperty(
        "--rotation",
        (
          Math.random() * 1200
          - 600
        ) + "deg"
      );


      /* -------------------------
         Random Color
      ------------------------- */

      piece.style.background =
        colors[
          Math.floor(
            Math.random()
            * colors.length
          )
        ];


      /* -------------------------
         Random Size
      ------------------------- */

      piece.style.width =
        (
          5 +
          Math.random() * 8
        ) + "px";


      piece.style.height =
        (
          8 +
          Math.random() * 16
        ) + "px";


      /* -------------------------
         Random Delay
      ------------------------- */

      piece.style.animationDelay =
        (
          Math.random() * 0.12
        ) + "s";


      /* -------------------------
         Add Piece
      ------------------------- */

      confetti.appendChild(
        piece
      );

    }


    /* -------------------------
       Remove Confetti
    ------------------------- */

    setTimeout(() => {

      confetti.innerHTML = "";

    }, 3500);

  }



  /* =========================
     REDIRECT
     VIDEO 2 ONLY
  ========================= */

  function redirectToCanva() {

    /*
      Make sure Video 2
      is currently active
    */

    if (
      video2.classList.contains("show")
    ) {

      window.location.href =
        "https://zekkra.my.canva.site/roro-henna";

    }

  }



  /* =========================
     DESKTOP CLICK
  ========================= */

  tapArea.addEventListener(
    "click",
    redirectToCanva
  );



  /* =========================
     MOBILE TOUCH
  ========================= */

  tapArea.addEventListener(
    "touchend",
    function(event) {

      event.preventDefault();

      redirectToCanva();

    },
    {
      passive: false
    }
  );


</script>


</body>

</html>
