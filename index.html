<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Invitation</title>


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGE
    ========================= */

    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {

      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       VIDEOS
    ========================= */

    video {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* =========================
       VIDEO 1
    ========================= */

    #video1 {

      z-index: 1;

    }


    /* =========================
       VIDEO 2
    ========================= */

    #video2 {

      z-index: 2;

      opacity: 0;

      transition:
        opacity 0.15s ease;

      pointer-events: none;

    }


    #video2.show {

      opacity: 1;

      pointer-events: auto;

    }


    /* =========================
       AUDIO
    ========================= */

    #song {

      display: none;

    }


    /* =========================
       CONFETTI
    ========================= */

    #confetti {

      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       CONFETTI PIECES
    ========================= */

    .piece {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 15px;

      opacity: 0;

      border-radius: 2px;

      animation:

        confettiExplosion

        2.8s

        cubic-bezier(.15, .7, .3, 1)

        forwards;

    }


    /* =========================
       CONFETTI ANIMATION
    ========================= */

    @keyframes confettiExplosion {

      0% {

        transform:

          translate(-50%, -50%)

          translate(0, 0)

          rotate(0deg)

          scale(0.4);

        opacity: 1;

      }


      15% {

        opacity: 1;

      }


      100% {

        transform:

          translate(-50%, -50%)

          translate(var(--x), var(--y))

          rotate(var(--rotation))

          scale(1);

        opacity: 0;

      }

    }


    /* =========================
       INVISIBLE TAP AREA
    ========================= */

    #tapArea {

      position: absolute;

      z-index: 20;

      width: 70%;
      height: 45%;

      left: 15%;
      top: 27.5%;

      cursor: pointer;

      background: transparent;

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      display: none;

    }


    #tapArea.active {

      display: block;

    }


    /* =========================
       CANVA CONTAINER
    ========================= */

    #canvaContainer {

      position: fixed;

      inset: 0;

      z-index: 100;

      width: 100vw;
      height: 100vh;

      background: white;

      display: none;

      overflow: hidden;

    }


    #canvaContainer.show {

      display: block;

    }


    /* =========================
       CANVA IFRAME
    ========================= */

    #canvaFrame {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      padding: 0;
      margin: 0;

      display: block;

    }


  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       VIDEO 1
  ========================= -->

  <video
    id="video1"
    autoplay
    muted
    playsinline
    preload="auto"
  >

    <source
      src="5.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       VIDEO 2
  ========================= -->

  <video
    id="video2"
    muted
    playsinline
    loop
    preload="auto"
  >

    <source
      src="6.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       AUDIO
    ========================= -->

  <audio
    id="song"
    preload="auto"
  >

    <source
      src="song.mp3"
      type="audio/mpeg"
    >

  </audio>


  <!-- =========================
       CONFETTI
  ========================= -->

  <div id="confetti"></div>


  <!-- =========================
       INVISIBLE TAP AREA
  ========================= -->

  <div id="tapArea"></div>


  <!-- =========================
       CANVA EMBED
  ========================= -->

  <div id="canvaContainer">

    <iframe
      id="canvaFrame"

      src=""

      allowfullscreen

      allow="fullscreen"

    ></iframe>

  </div>


</div>



<script>


  /* =========================
     ELEMENTS
  ========================= */

  const video1 =
    document.getElementById("video1");


  const video2 =
    document.getElementById("video2");


  const confetti =
    document.getElementById("confetti");


  const tapArea =
    document.getElementById("tapArea");


  const song =
    document.getElementById("song");


  const canvaContainer =
    document.getElementById(
      "canvaContainer"
    );


  const canvaFrame =
    document.getElementById(
      "canvaFrame"
    );


  /* =========================
     CANVA URL
  ========================= */

  const CANVA_URL =

    "https://www.canva.com/design/DAHWsDYPq3k/BJt-oUK1cNMC3uRSdF-f0w/view?embed";


  /* =========================
     START VIDEO 1
  ========================= */

  video1.play().catch(error => {

    console.log(
      "Video 1 autoplay:",
      error
    );

  });


  /* =========================
     VIDEO 1 FINISHED
  ========================= */

  video1.addEventListener(

    "ended",

    startVideo2

  );


  function startVideo2() {


    console.log(
      "Video 1 finished"
    );


    /* -------------------------
       Start Video 2
    ------------------------- */

    video2.currentTime = 0;


    video2.play().catch(error => {

      console.log(
        "Video 2 play error:",
        error
      );

    });


    /* -------------------------
       Show Video 2
    ------------------------- */

    video2.classList.add(
      "show"
    );


    /* -------------------------
       Hide Video 1
    ------------------------- */

    setTimeout(() => {

      video1.style.display =
        "none";

    }, 200);


    /* -------------------------
       Activate Tap Area
    ------------------------- */

    tapArea.classList.add(
      "active"
    );


    /* -------------------------
       Start Confetti
    ------------------------- */

    createConfetti();

  }


  /* =========================
     CREATE CONFETTI
  ========================= */

  function createConfetti() {


    confetti.innerHTML = "";


    const colors = [

      "#FFD166",

      "#EF476F",

      "#06D6A0",

      "#118AB2",

      "#8338EC",

      "#FF9F1C",

      "#FF70A6",

      "#FFFFFF"

    ];


    const pieces = 120;


    for (

      let i = 0;

      i < pieces;

      i++

    ) {


      const piece =

        document.createElement(
          "div"
        );


      piece.className =
        "piece";


      /* -------------------------
         Random Direction
      ------------------------- */

      const angle =

        Math.random()

        * Math.PI

        * 2;


      /* -------------------------
         Random Distance
      ------------------------- */

      const distance =

        300 +

        Math.random() * 650;


      const x =

        Math.cos(angle)

        * distance;


      const y =

        Math.sin(angle)

        * distance;


      /* -------------------------
         Position
      ------------------------- */

      piece.style.setProperty(

        "--x",

        x + "px"

      );


      piece.style.setProperty(

        "--y",

        y + "px"

      );


      /* -------------------------
         Rotation
      ------------------------- */

      piece.style.setProperty(

        "--rotation",

        (

          Math.random()

          * 1200

          - 600

        ) + "deg"

      );


      /* -------------------------
         Color
      ------------------------- */

      piece.style.background =

        colors[

          Math.floor(

            Math.random()

            * colors.length

          )

        ];


      /* -------------------------
         Size
      ------------------------- */

      piece.style.width =

        (

          5 +

          Math.random() * 8

        ) + "px";


      piece.style.height =

        (

          8 +

          Math.random() * 16

        ) + "px";


      /* -------------------------
         Delay
      ------------------------- */

      piece.style.animationDelay =

        (

          Math.random() * 0.12

        ) + "s";


      /* -------------------------
         Add
      ------------------------- */

      confetti.appendChild(
        piece
      );

    }


    /* -------------------------
       Remove
    ------------------------- */

    setTimeout(() => {

      confetti.innerHTML = "";

    }, 3500);

  }


  /* =========================
     PLAY SONG
  ========================= */

  function playSong() {


    song.volume = 1;


    song.currentTime = 0;


    const playPromise =
      song.play();


    if (
      playPromise !== undefined
    ) {

      playPromise.catch(error => {

        console.log(
          "Audio play error:",
          error
        );

      });

    }

  }


  /* =========================
     SHOW CANVA
  ========================= */

  function showCanva() {


    /* -------------------------
       Load Canva
    ------------------------- */

    canvaFrame.src =
      CANVA_URL;


    /* -------------------------
       Hide Video 2
    ------------------------- */

    video2.pause();


    video2.style.display =
      "none";


    /* -------------------------
       Hide Tap Area
    ------------------------- */

    tapArea.style.display =
      "none";


    /* -------------------------
       Remove Confetti
    ------------------------- */

    confetti.innerHTML =
      "";


    /* -------------------------
       Show Canva
    ------------------------- */

    canvaContainer.classList.add(
      "show"
    );

  }


  /* =========================
     OPEN INVITATION
    ========================= */

  function openInvitation() {


    /*
      Only work during Video 2
    */

    if (

      !video2.classList.contains(
        "show"
      )

    ) {

      return;

    }


    /*
      IMPORTANT:

      Audio starts directly
      from the user's gesture.
    */

    playSong();


    /*
      Then show Canva.
    */

    showCanva();

  }


  /* =========================
     DESKTOP CLICK
  ========================= */

  tapArea.addEventListener(

    "click",

    openInvitation

  );


  /* =========================
     MOBILE TOUCH
  ========================= */

  tapArea.addEventListener(

    "touchend",

    function(event) {

      event.preventDefault();

      openInvitation();

    },

    {
      passive: false
    }

  );


</script>


</body>

</html>
