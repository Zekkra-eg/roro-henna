<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Invitation</title>


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGE
    ========================= */

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: transparent;

    }


    /* =========================
       VIDEOS
    ========================= */

    video {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    #video1 {

      z-index: 1;

    }


    #video2 {

      z-index: 2;

      opacity: 0;

      transition:
        opacity 0.15s ease;

      pointer-events: none;

    }


    #video2.show {

      opacity: 1;

      pointer-events: auto;

    }


    /* =========================
       AUDIO
    ========================= */

    #bg-music {

      position: absolute;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;

    }


    /* =========================
       CONFETTI
    ========================= */

    #confetti {

      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

      overflow: hidden;

      background: transparent;

    }


    .piece {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 8px;
      height: 15px;

      opacity: 0;

      border-radius: 2px;

      animation:
        confettiExplosion
        2.8s
        cubic-bezier(.15, .7, .3, 1)
        forwards;

    }


    @keyframes confettiExplosion {

      0% {

        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(0deg)
          scale(0.4);

        opacity: 1;

      }


      15% {

        opacity: 1;

      }


      100% {

        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          rotate(var(--rotation))
          scale(1);

        opacity: 0;

      }

    }


    /* =========================
       TAP AREA
    ========================= */

    #tapArea {

      position: absolute;

      z-index: 20;

      width: 70%;
      height: 45%;

      left: 15%;
      top: 27.5%;

      cursor: pointer;

      background: transparent;

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      touch-action: manipulation;

      display: none;

    }


    #tapArea.active {

      display: block;

    }


    /* =========================
       SOUND ERROR / FALLBACK
    ========================= */

    #soundMessage {

      position: fixed;

      z-index: 200;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      display: none;

      padding: 12px 20px;

      border-radius: 30px;

      background: rgba(0,0,0,0.85);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

      text-align: center;

      white-space: nowrap;

    }


    #soundMessage.show {

      display: block;

    }


    /* =========================
       SOUND BUTTON
    ========================= */

    #soundButton {

      position: fixed;

      z-index: 250;

      right: 22px;

      bottom: 22px;

      width: 46px;

      height: 46px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.35);

      background: rgba(0,0,0,0.18);

      backdrop-filter: blur(4px);

      -webkit-backdrop-filter: blur(4px);

      display: none;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      padding: 0;

      outline: none;

      -webkit-tap-highlight-color: transparent;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.15);

      animation:
        soundButtonFloat
        2.2s
        ease-in-out
        infinite;

    }


    #soundButton.show {

      display: flex;

    }


    #soundButton:active {

      transform: scale(0.88);

    }


    @keyframes soundButtonFloat {

      0%,
      100% {

        transform: scale(1);

      }

      50% {

        transform: scale(1.07);

      }

    }


    /* =========================
       SPEAKER ICON
    ========================= */

    .speakerIcon {

      position: relative;

      width: 22px;

      height: 22px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .speakerBody {

      position: absolute;

      left: 2px;

      width: 7px;

      height: 9px;

      background: white;

      border-radius: 2px;

    }


    .speakerCone {

      position: absolute;

      left: 7px;

      width: 0;
      height: 0;

      border-top: 7px solid transparent;

      border-bottom: 7px solid transparent;

      border-right: 10px solid white;

      transform: rotate(180deg);

    }


    .soundWave1,
    .soundWave2 {

      position: absolute;

      border: 2px solid white;

      border-left: 0;

      border-top: 0;

      border-bottom: 0;

      border-radius: 50%;

      transform: rotate(0deg);

    }


    .soundWave1 {

      width: 8px;

      height: 13px;

      right: 1px;

    }


    .soundWave2 {

      width: 13px;

      height: 19px;

      right: -2px;

    }


    /* =========================
       MUTED STATE
    ========================= */

    #soundButton.muted .soundWave1,
    #soundButton.muted .soundWave2 {

      display: none;

    }


    #soundButton.muted::after {

      content: "";

      position: absolute;

      width: 25px;

      height: 2px;

      background: white;

      border-radius: 2px;

      transform: rotate(-45deg);

    }


    /* =========================
       CANVA
    ========================= */

    #canvaContainer {

      position: fixed;

      inset: 0;

      z-index: 100;

      width: 100vw;
      height: 100vh;

      background: white;

      display: none;

      overflow: hidden;

    }


    #canvaContainer.show {

      display: block;

    }


    #canvaFrame {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      padding: 0;
      margin: 0;

      display: block;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       VIDEO 1
  ========================= -->

  <video
    id="video1"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
  >

    <source
      src="5.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       VIDEO 2
  ========================= -->

  <video
    id="video2"
    muted
    playsinline
    webkit-playsinline
    loop
    preload="auto"
  >

    <source
      src="6.mp4"
      type="video/mp4"
    >

  </video>


  <!-- =========================
       AUDIO
  ========================= -->

  <audio
    id="bg-music"
    src="song2.mp3"
    loop
    preload="auto"
  ></audio>


  <!-- =========================
       CONFETTI
  ========================= -->

  <div id="confetti"></div>


  <!-- =========================
       TAP AREA
  ========================= -->

  <div id="tapArea"></div>


  <!-- =========================
       SOUND MESSAGE
  ========================= -->

  <div id="soundMessage">
    Tap again to play the music
  </div>


  <!-- =========================
       SOUND BUTTON
  ========================= -->

  <button
    id="soundButton"
    aria-label="Toggle music"
    type="button"
  >

    <span class="speakerIcon">

      <span class="speakerBody"></span>

      <span class="speakerCone"></span>

      <span class="soundWave1"></span>

      <span class="soundWave2"></span>

    </span>

  </button>


  <!-- =========================
       CANVA
  ========================= -->

  <div id="canvaContainer">

    <iframe
      id="canvaFrame"
      title="Invitation"
      allow="fullscreen"
      allowfullscreen
    ></iframe>

  </div>


</div>


<script>


  /* =========================
     ELEMENTS
  ========================= */

  const video1 =
    document.getElementById("video1");

  const video2 =
    document.getElementById("video2");

  const audio =
    document.getElementById("bg-music");

  const confetti =
    document.getElementById("confetti");

  const tapArea =
    document.getElementById("tapArea");

  const soundMessage =
    document.getElementById("soundMessage");

  const soundButton =
    document.getElementById("soundButton");

  const canvaContainer =
    document.getElementById(
      "canvaContainer"
    );

  const canvaFrame =
    document.getElementById(
      "canvaFrame"
    );


  /* =========================
     CANVA URL
  ========================= */

  const CANVA_URL =
    "https://www.canva.com/design/DAHWsDYPq3k/BJt-oUK1cNMC3uRSdF-f0w/view?embed";


  /* =========================
     VIDEO 1
  ========================= */

  video1.play().catch(error => {

    console.log(
      "Video 1 autoplay blocked:",
      error
    );

  });


  /* =========================
     VIDEO 1 ENDED
  ========================= */

  video1.addEventListener(
    "ended",
    startVideo2
  );


  /* =========================
     START VIDEO 2
  ========================= */

  function startVideo2() {

    video2.currentTime = 0;


    video2.play().catch(error => {

      console.log(
        "Video 2 play error:",
        error
      );

    });


    video2.classList.add(
      "show"
    );


    setTimeout(() => {

      video1.style.display =
        "none";

    }, 200);


    tapArea.classList.add(
      "active"
    );


    createConfetti();

  }


  /* =========================
     CONFETTI
     ========================= */

  function createConfetti() {

    confetti.innerHTML = "";


    const colors = [

      "#FFD166",
      "#EF476F",
      "#06D6A0",
      "#118AB2",
      "#8338EC",
      "#FF9F1C",
      "#FF70A6",
      "#FFFFFF"

    ];


    const pieces = 120;


    for (
      let i = 0;
      i < pieces;
      i++
    ) {

      const piece =
        document.createElement(
          "div"
        );


      piece.className =
        "piece";


      const angle =
        Math.random()
        * Math.PI
        * 2;


      const distance =
        300 +
        Math.random() * 650;


      const x =
        Math.cos(angle)
        * distance;


      const y =
        Math.sin(angle)
        * distance;


      piece.style.setProperty(
        "--x",
        x + "px"
      );


      piece.style.setProperty(
        "--y",
        y + "px"
      );


      piece.style.setProperty(
        "--rotation",
        (
          Math.random() * 1200
          - 600
        ) + "deg"
      );


      piece.style.background =
        colors[
          Math.floor(
            Math.random()
            * colors.length
          )
        ];


      piece.style.width =
        (
          5 +
          Math.random() * 8
        ) + "px";


      piece.style.height =
        (
          8 +
          Math.random() * 16
        ) + "px";


      piece.style.animationDelay =
        (
          Math.random() * 0.12
        ) + "s";


      confetti.appendChild(
        piece
      );

    }


    setTimeout(() => {

      confetti.innerHTML = "";

    }, 3500);

  }


  /* =====================================================
     AUDIO
     ===================================================== */

  let audioStarted = false;


  async function startMusic() {

    if (audioStarted) {

      return true;

    }


    audio.volume = 1;

    audio.muted = false;


    try {

      await audio.play();

      audioStarted = true;


      soundButton.classList.add(
        "show"
      );


      soundButton.classList.remove(
        "muted"
      );


      console.log(
        "HTML AUDIO STARTED"
      );


      return true;

    }

    catch (error) {

      console.warn(
        "HTML audio failed:",
        error
      );

      return false;

    }

  }


  /* =====================================================
     PLAY / PAUSE BUTTON
     ===================================================== */

  soundButton.addEventListener(
    "click",
    async function (event) {

      event.stopPropagation();


      if (
        audio.paused
      ) {

        try {

          await audio.play();

          soundButton.classList.remove(
            "muted"
          );

        }

        catch (error) {

          console.warn(
            "Audio play failed:",
            error
          );

        }

      }

      else {

        audio.pause();

        soundButton.classList.add(
          "muted"
        );

      }

    }
  );


  /* =====================================================
     SHOW CANVA
     ===================================================== */

  function showCanva() {

    video2.pause();

    video2.style.display =
      "none";

    tapArea.style.display =
      "none";

    confetti.innerHTML =
      "";

    canvaContainer.classList.add(
      "show"
    );

    canvaFrame.src =
      CANVA_URL;

  }


  /* =====================================================
     OPEN INVITATION
     ===================================================== */

  let opened = false;


  tapArea.addEventListener(
    "click",
    async function () {


      if (opened) {

        return;

      }


      if (
        !video2.classList.contains(
          "show"
        )
      ) {

        return;

      }


      /*
        User directly clicked
        the invitation.
      */

      const started =
        await startMusic();


      /*
        If Safari accepted
        the audio, open Canva.
      */

      if (started) {

        opened = true;

        soundMessage.classList.remove(
          "show"
        );

        showCanva();

        return;

      }


      /*
        Safari rejected audio.
      */

      soundMessage.classList.add(
        "show"
      );


    },
    {
      passive: true
    }
  );


  /* =====================================================
     KEEP BUTTON IN SYNC
     ===================================================== */

  audio.addEventListener(
    "play",
    function () {

      soundButton.classList.remove(
        "muted"
      );

    }
  );


  audio.addEventListener(
    "pause",
    function () {

      soundButton.classList.add(
        "muted"
      );

    }
  );


</script>


</body>

</html>
