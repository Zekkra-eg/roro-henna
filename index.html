<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Invitation</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }

    #canvaFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 30;
      display: none;
      background: #fff;
    }

    #songPlayer {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 40;
      width: 180px;
      opacity: 0.9;
    }

    /* =========================
       VIDEOS
    ========================= */

    video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    #video1 {
      z-index: 2;
    }


    #video2 {
      z-index: 1;

      opacity: 0;
    }


    #video2.show {
      opacity: 1;
    }


    /* =========================
       CONFETTI
    ========================= */

    #confetti {
      position: absolute;
      inset: 0;

      z-index: 10;

      pointer-events: none;

      overflow: hidden;
    }


    .piece {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 9px;
      height: 16px;

      opacity: 1;

      animation: explode 2.5s ease-out forwards;
    }


    @keyframes explode {

      0% {

        transform:
          translate(-50%, -50%)
          translate(0, 0)
          rotate(0deg);

        opacity: 1;
      }

      100% {

        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          rotate(var(--rotate));

        opacity: 0;
      }

    }


    /* =========================
       BUTTON
    ========================= */

    #continueButton {

      position: absolute;

      z-index: 20;

      left: 50%;
      bottom: 8%;

      transform: translateX(-50%);

      padding: 14px 35px;

      border: none;
      border-radius: 40px;

      background: white;

      color: #333;

      font-size: 16px;

      cursor: pointer;

      opacity: 0;

      pointer-events: none;

      transition: 0.5s ease;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.2);
    }


    #continueButton.show {

      opacity: 1;

      pointer-events: auto;
    }

  </style>

</head>


<body>


<div class="container" id="container">

  <iframe
    id="canvaFrame"
    title="Henna Canva Invite"
    src=""
    allowfullscreen
    allow="fullscreen"
  ></iframe>

  <audio id="songPlayer" controls loop preload="auto">
    <source src="./song.mp3" type="audio/mpeg">
  </audio>


  <!-- VIDEO 1 -->

  <video
    id="video1"
    autoplay
    muted
    playsinline
    preload="auto"
  >

    <source
      src="./Intros/5.mp4"
      type="video/mp4"
    >

  </video>


  <!-- VIDEO 2 -->

  <video
    id="video2"
    muted
    playsinline
    loop
    preload="auto"
  >

    <source
      src="./Intros/6.mp4"
      type="video/mp4"
    >

  </video>


  <!-- CONFETTI -->

  <div id="confetti"></div>


  <!-- BUTTON -->

  <button id="continueButton">
    Continue
  </button>


</div>



<script>


  const video1 =
    document.getElementById("video1");


  const video2 =
    document.getElementById("video2");


  const confetti =
    document.getElementById("confetti");


  const button =
    document.getElementById("continueButton");

  const container =
    document.getElementById("container");

  const canvaFrame =
    document.getElementById("canvaFrame");

  const songPlayer =
    document.getElementById("songPlayer");

  let musicStarted = false;


  function startMusicAndOpenCanva() {
    if(!musicStarted){
      musicStarted = true;
      songPlayer.volume = 0.7;
      songPlayer.play().catch(() => {
        console.log("Song autoplay blocked until user interaction.");
      });
    }

    window.open(
      "https://zekra.link/roro-henna",
      "_blank",
      "noopener,noreferrer"
    );

    video1.pause();
    video2.pause();
    button.classList.remove("show");
  }



  /* =================================
     START VIDEO 1
  ================================= */

  video1.play().catch(error => {

    console.log(
      "Video 1 autoplay blocked:",
      error
    );

  });



  /* =================================
     WHEN VIDEO 1 FINISHES
  ================================= */

  video1.addEventListener(
    "ended",
    startVideo2
  );



  function startVideo2() {


    console.log(
      "VIDEO 1 FINISHED"
    );


    /*

      Make sure video 1
      disappears

    */

    video1.style.display =
      "none";


    /*

      Show video 2

    */

    video2.classList.add(
      "show"
    );


    /*

      Start video 2

    */

    video2.currentTime = 0;


    video2.play().catch(error => {

      console.log(
        "Video 2 error:",
        error
      );

    });


    /*

      Celebration

    */

    createConfetti();


    /*

      Show button

    */

    setTimeout(() => {

      button.classList.add(
        "show"
      );

    }, 700);

  }



  /* =================================
     CONFETTI
  ================================= */

  function createConfetti() {


    confetti.innerHTML = "";


    const colors = [

      "#FFD166",
      "#EF476F",
      "#06D6A0",
      "#118AB2",
      "#8338EC",
      "#FF9F1C",
      "#FF70A6",
      "#FFFFFF"

    ];


    for (
      let i = 0;
      i < 120;
      i++
    ) {


      const piece =
        document.createElement(
          "div"
        );


      piece.className =
        "piece";


      /*

        Random direction

      */

      const angle =
        Math.random()
        * Math.PI
        * 2;


      const distance =
        300 +
        Math.random() * 700;


      const x =
        Math.cos(angle)
        * distance;


      const y =
        Math.sin(angle)
        * distance;


      piece.style.setProperty(
        "--x",
        x + "px"
      );


      piece.style.setProperty(
        "--y",
        y + "px"
      );


      piece.style.setProperty(
        "--rotate",
        (Math.random() * 1000) + "deg"
      );


      /*

        Random color

      */

      piece.style.background =
        colors[
          Math.floor(
            Math.random()
            * colors.length
          )
        ];


      /*

        Random size

      */

      piece.style.width =
        (5 + Math.random() * 8)
        + "px";


      piece.style.height =
        (8 + Math.random() * 15)
        + "px";


      /*

        Random delay

      */

      piece.style.animationDelay =
        (Math.random() * 0.15)
        + "s";


      confetti.appendChild(
        piece
      );

    }


    setTimeout(() => {

      confetti.innerHTML = "";

    }, 3500);

  }



  /* =================================
     BUTTON
  ================================= */

  button.addEventListener(
    "click",
    function() {
      startMusicAndOpenCanva();
    }
  );

  container.addEventListener(
    "click",
    function(event) {
      if(
        event.target === button ||
        event.target.closest("button")
      ){
        return;
      }

      startMusicAndOpenCanva();
    }
  );


</script>


</body>

</html>
