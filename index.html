<script>

  const video1 = document.getElementById("video1");
  const video2 = document.getElementById("video2");
  const song = document.getElementById("song");
  const confetti = document.getElementById("confetti");
  const tapArea = document.getElementById("tapArea");
  const canvaContainer = document.getElementById("canvaContainer");
  const canvaFrame = document.getElementById("canvaFrame");

  const CANVA_URL =
    "https://www.canva.com/design/DAHWsDYPq3k/BJt-oUK1cNMC3uRSdF-f0w/view?embed";


  /* =========================
     VIDEO 1
  ========================= */

  video1.play().catch(error => {
    console.log("Video 1 autoplay blocked:", error);
  });


  /* =========================
     VIDEO 1 ENDED
  ========================= */

  video1.addEventListener("ended", startVideo2);


  /* =========================
     START VIDEO 2
  ========================= */

  function startVideo2() {

    video2.currentTime = 0;

    video2.play().catch(error => {
      console.log("Video 2 play error:", error);
    });

    video2.classList.add("show");

    setTimeout(() => {
      video1.style.display = "none";
    }, 200);

    tapArea.classList.add("active");

    createConfetti();
  }


  /* =========================
     CONFETTI
  ========================= */

  function createConfetti() {

    confetti.innerHTML = "";

    const colors = [
      "#FFD166",
      "#EF476F",
      "#06D6A0",
      "#118AB2",
      "#8338EC",
      "#FF9F1C",
      "#FF70A6",
      "#FFFFFF"
    ];

    const pieces = 120;

    for (let i = 0; i < pieces; i++) {

      const piece = document.createElement("div");

      piece.className = "piece";

      const angle =
        Math.random() * Math.PI * 2;

      const distance =
        300 + Math.random() * 650;

      const x =
        Math.cos(angle) * distance;

      const y =
        Math.sin(angle) * distance;

      piece.style.setProperty("--x", x + "px");
      piece.style.setProperty("--y", y + "px");

      piece.style.setProperty(
        "--rotation",
        (Math.random() * 1200 - 600) + "deg"
      );

      piece.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      piece.style.width =
        (5 + Math.random() * 8) + "px";

      piece.style.height =
        (8 + Math.random() * 16) + "px";

      piece.style.animationDelay =
        (Math.random() * 0.12) + "s";

      confetti.appendChild(piece);
    }

    setTimeout(() => {
      confetti.innerHTML = "";
    }, 3500);
  }


  /* =========================
     PLAY SONG
     SAFARI VERSION
  ========================= */

  function playSongFromGesture() {

    /*
      IMPORTANT:
      Do NOT call song.load()
      here.

      Safari needs play()
      to happen directly from
      the user gesture.
    */

    song.volume = 1;
    song.muted = false;

    const promise = song.play();

    if (promise !== undefined) {

      promise
        .then(() => {

          console.log(
            "✅ Safari: song started"
          );

        })
        .catch(error => {

          console.log(
            "❌ Audio blocked:",
            error
          );

        });
    }
  }


  /* =========================
     SHOW CANVA
  ========================= */

  function showCanva() {

    video2.pause();

    video2.style.display = "none";

    tapArea.style.display = "none";

    confetti.innerHTML = "";

    canvaContainer.classList.add("show");

    /*
      Load Canva after the audio
      play() has been requested.
    */

    canvaFrame.src = CANVA_URL;
  }


  /* =========================
     OPEN INVITATION
  ========================= */

  let opened = false;

  function openInvitation(event) {

    if (opened) {
      return;
    }

    if (!video2.classList.contains("show")) {
      return;
    }

    opened = true;

    /*
      FIRST ACTION:
      Start audio directly
      from the user's gesture.
    */

    playSongFromGesture();

    /*
      THEN open Canva.
    */

    showCanva();
  }


  /* =========================
     SAFARI / iOS TOUCH
  ========================= */

  tapArea.addEventListener(
    "touchend",
    openInvitation,
    {
      passive: true
    }
  );


  /* =========================
     DESKTOP / OTHER BROWSERS
  ========================= */

  tapArea.addEventListener(
    "click",
    openInvitation
  );

</script>
